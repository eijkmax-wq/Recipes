<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mijn Recepten</title>
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recepten">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="pageTitle">Recepten</h1>
  </header>

  <main>
    <!-- RECEPTEN -->
    <section id="view-recepten" class="view">
      <div id="suggesties"></div>

      <div class="filters">
        <input id="zoek" type="search" placeholder="Zoek recept of ingrediënt…" autocomplete="off">
        <div class="filterrij">
          <label class="select">
            <span>Tijd</span>
            <select id="maxTijd">
              <option value="">Alles</option>
              <option value="15">≤ 15 min</option>
              <option value="30">≤ 30 min</option>
              <option value="45">≤ 45 min</option>
            </select>
          </label>
          <label class="select">
            <span>Met wat ik heb</span>
            <select id="thuisFilter">
              <option value="">Maakt niet uit</option>
              <option value="0">Alles in huis</option>
              <option value="1">Mist max 1</option>
              <option value="2">Mist max 2</option>
            </select>
          </label>
        </div>
        <div id="tagChips" class="chips"></div>
      </div>

      <p id="aantal" class="muted"></p>
      <ul id="lijst" class="kaarten"></ul>
    </section>

    <!-- THUIS -->
    <section id="view-thuis" class="view" hidden>
      <p class="muted">Vink aan wat je in huis hebt. Basisdingen zoals zout en olie tellen niet mee.</p>
      <form id="thuisForm" class="thuisform">
        <input id="thuisInput" list="alleIngredienten" placeholder="Iets anders toevoegen…" autocomplete="off">
        <button type="submit">+</button>
      </form>
      <datalist id="alleIngredienten"></datalist>
      <div id="thuisLijst"></div>
      <button id="thuisLeeg" class="linkknop">Alles uitvinken</button>
    </section>
  </main>

  <!-- DETAIL -->
  <div id="detail" class="detail" hidden>
    <div class="detailbalk">
      <button id="terug" aria-label="Terug">‹ Terug</button>
    </div>
    <article id="detailInhoud"></article>
  </div>

  <nav class="tabs">
    <button data-view="recepten" class="actief">📖<span>Recepten</span></button>
    <button data-view="thuis">🧺<span>Thuis</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
