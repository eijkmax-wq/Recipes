<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mijn Recepten</title>
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recepten">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="pageTitle">Recepten</h1>
  </header>

  <main>
    <!-- RECEPTEN -->
    <section id="view-recepten" class="view">
      <div id="suggesties"></div>

      <div class="filters">
        <input id="zoek" type="search" placeholder="Zoek recept of ingrediënt…" autocomplete="off">
        <div class="filterrij een">
          <label class="select">
            <span>Tijd</span>
            <select id="maxTijd">
              <option value="">Alles</option>
              <option value="15">≤ 15 min</option>
              <option value="30">≤ 30 min</option>
              <option value="45">≤ 45 min</option>
            </select>
          </label>
        </div>
        <div id="tagChips" class="chips"></div>
      </div>

      <p id="aantal" class="muted"></p>
      <ul id="lijst" class="kaarten"></ul>
    </section>

    <!-- OPMAKEN -->
    <section id="view-opmaken" class="view" hidden>
      <p class="muted">Wat ligt er nog en moet op? Typ en kies uit de lijst.</p>
      <div class="zoekvak">
        <input id="restInput" placeholder="bv. courgette, feta…" autocomplete="off" autocapitalize="none" enterkeyhint="done">
        <ul id="dropdown" class="dropdown" hidden></ul>
      </div>
      <div id="restChips" class="chips"></div>
      <p id="restAantal" class="muted"></p>
      <ul id="restLijst" class="kaarten"></ul>
    </section>
  </main>

  <!-- DETAIL -->
  <div id="detail" class="detail" hidden>
    <div class="detailbalk">
      <button id="terug" aria-label="Terug">‹ Terug</button>
    </div>
    <article id="detailInhoud"></article>
  </div>

  <nav class="tabs">
    <button data-view="recepten" class="actief">📖<span>Recepten</span></button>
    <button data-view="opmaken">🧺<span>Opmaken</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
